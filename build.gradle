plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'jacoco'
    id 'com.gradleup.shadow' version '9.5.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

dependencies {
    String jUnitVersion = '5.14.4'

    implementation 'org.jline:jline-reader:4.4.8'
    runtimeOnly 'org.jline:jline-terminal-jni:4.4.8'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

test {
    useJUnitPlatform()
    // Exercise internal invariants during every test run as well as application runs.
    enableAssertions = true

    testLogging {
        events 'passed', 'skipped', 'failed'

        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }
}

// Java 25 requires a compatible coverage agent. Reports distinguish tested lines from branches.
jacoco {
    toolVersion = '0.8.14'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

// Guard the plan-changing commands against gaps in both statements and decisions.
jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            element = 'CLASS'
            includes = ['mishmash.command.ResetPlanCommand', 'mishmash.command.GeneratePlanCommand',
                        'mishmash.command.SetDietCommand']
            limit {
                counter = 'LINE'
                minimum = 1.0
            }
            limit {
                counter = 'BRANCH'
                minimum = 1.0
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

application {
    mainClass = 'mishmash.MishMash'
    applicationDefaultJvmArgs = ['-ea', '--enable-native-access=ALL-UNNAMED']
}

jar {
    // A lean JAR file (i.e., without the dependencies packaged inside) is not needed.
    enabled = false
    // Rename its output anyway; Gradle forbids it clashing with the shadowJar output file, even for a disabled task.
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    archiveFileName = 'MishMash.jar'
    // Preserve terminal-provider service metadata when packaging dependencies.
    mergeServiceFiles()
    manifest {
        attributes 'Enable-Native-Access': 'ALL-UNNAMED'
    }
}

checkstyle {
    toolVersion = '14.1.0'
}

run {
    standardInput = System.in
}
